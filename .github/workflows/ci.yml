name: CI

# Tests only Windows Desktop App (WinApp) and Web App (WebApp / WASM).
# Non-target OSes (Linux desktop, macOS, FreeBSD, Nix) are excluded.
on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winapp:
    name: Windows App (DTHFrame Desktop)
    runs-on: windows-latest
    steps:
      - name: Checkout DocCraftTH
        uses: actions/checkout@v5

      - name: Checkout craft-fonts
        uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The interface translations (storytold/craft-i18n) at the revision the repository pins, so
      # the tests that need a non-English interface run instead of failing for want of a catalog.
      - name: Checkout craft-i18n
        shell: pwsh
        run: |
          git clone https://github.com/storytold/craft-i18n craft-i18n
          git -C craft-i18n checkout (Get-Content craft-i18n.rev).Trim()
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run Cargo Check and Tests
        shell: pwsh
        run: |
          $env:CRAFT_FONTS_DIR = (Resolve-Path "craft-fonts").Path
          $env:CRAFT_I18N_DIR = (Resolve-Path "craft-i18n").Path
          # pwsh keeps going after a failed native command and the step's result is the last
          # command's, so a failed test used to leave the job green. Run every command, then fail
          # the step if any of them failed.
          $failed = @()
          function Invoke-Cargo {
            cargo @args
            if ($LASTEXITCODE -ne 0) { $script:failed += "cargo $args" }
          }
          Invoke-Cargo check --locked -p pdfcraft -p pdfcraft-cli
          Invoke-Cargo test --locked --lib -p pdfcraft-fonts -p pdfcraft-render -p pdfcraft-engine -p pdfcraft-ui-egui
          Invoke-Cargo test --locked -p pdfcraft-engine --test doc_title_names --test thai_ocr
          # `--test it fonts --test it thai_wrap` is not valid cargo (one test filter), and it always
          # failed unseen; the filters belong after `--`, where libtest takes several.
          Invoke-Cargo test --locked -p pdfcraft-ui-egui --test it -- fonts thai_wrap
          Invoke-Cargo test --locked -p pdfcraft --test help
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "::error::failed: $_" }
            exit 1
          }

  webapp:
    name: Web App (DTHFrame Web WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DocCraftTH
        uses: actions/checkout@v5

      - name: Checkout craft-fonts
        uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: Set up Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pin trunk. With the default (latest) the action asks the GitHub API (via the old thedodd/trunk
      # path, which now answers 301) for the newest release and, when that gives no tag, silently falls
      # back to v0.19.1, which fails in 0s with "error creating final dist directory" because
      # ../../dist does not exist on a fresh checkout. v0.22.1 creates it (checked locally).
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.22.1

      - name: Build Web App
        shell: bash
        run: |
          export CRAFT_FONTS_DIR="$PWD/craft-fonts"
          cd apps/pdfcraft-web
          trunk build --release

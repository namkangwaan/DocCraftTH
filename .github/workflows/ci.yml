name: CI

# Tests only Windows Desktop App (WinApp) and Web App (WebApp / WASM).
# Non-target OSes (Linux desktop, macOS, FreeBSD, Nix) are excluded.
on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winapp:
    name: Windows App (DTHFrame Desktop)
    runs-on: windows-latest
    steps:
      - name: Checkout DocCraftTH
        uses: actions/checkout@v4

      - name: Checkout craft-fonts
        uses: actions/checkout@v4
        with:
          repository: namkangwaan/craft-fonts
          path: craft-fonts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Cargo Check and Tests
        shell: pwsh
        run: |
          $env:CRAFT_FONTS_DIR = (Resolve-Path "craft-fonts").Path
          cargo check --locked -p pdfcraft -p pdfcraft-cli
          cargo test --locked -p pdfcraft -p pdfcraft-cli -p pdfcraft-fonts -p pdfcraft-ui-egui -p pdfcraft-engine

  webapp:
    name: Web App (DTHFrame Web WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DocCraftTH
        uses: actions/checkout@v4

      - name: Checkout craft-fonts
        uses: actions/checkout@v4
        with:
          repository: namkangwaan/craft-fonts
          path: craft-fonts

      - name: Set up Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build Web App
        shell: bash
        run: |
          export CRAFT_FONTS_DIR="$PWD/craft-fonts"
          cd apps/pdfcraft-web
          trunk build --release

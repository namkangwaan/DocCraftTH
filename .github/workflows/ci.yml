name: CI

# Tests only Windows Desktop App (WinApp) and Web App (WebApp / WASM).
# Non-target OSes (Linux desktop, macOS, FreeBSD, Nix) are excluded.
on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winapp:
    name: Windows App (DTHFrame Desktop)
    runs-on: windows-latest
    steps:
      - name: Checkout DocCraftTH
        uses: actions/checkout@v5

      - name: Checkout craft-fonts
        uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Cargo Check and Tests
        shell: pwsh
        run: |
          $env:CRAFT_FONTS_DIR = (Resolve-Path "craft-fonts").Path
          cargo check --locked -p pdfcraft -p pdfcraft-cli
          cargo test --locked --lib -p pdfcraft-fonts -p pdfcraft-render -p pdfcraft-engine -p pdfcraft-ui-egui
          cargo test --locked -p pdfcraft-engine --test doc_title_names --test thai_ocr
          cargo test --locked -p pdfcraft-ui-egui --test it fonts --test it thai_wrap
          cargo test --locked -p pdfcraft --test help

  webapp:
    name: Web App (DTHFrame Web WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DocCraftTH
        uses: actions/checkout@v5

      - name: Checkout craft-fonts
        uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: Set up Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pin trunk. With the default (latest) the action asks the GitHub API (via the old thedodd/trunk
      # path, which now answers 301) for the newest release and, when that gives no tag, silently falls
      # back to v0.19.1, which fails in 0s with "error creating final dist directory" because
      # ../../dist does not exist on a fresh checkout. v0.22.1 creates it (checked locally).
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.22.1

      - name: Build Web App
        shell: bash
        run: |
          export CRAFT_FONTS_DIR="$PWD/craft-fonts"
          cd apps/pdfcraft-web
          trunk build --release
